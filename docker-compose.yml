services:
  db:
    image: postgres:16-alpine
    container_name: docvault-db
    environment:
      POSTGRES_USER: docvault
      POSTGRES_PASSWORD: docvaultpassword
      POSTGRES_DB: docvault
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: docvault-minio
    environment:
      MINIO_ROOT_USER: docvaultadmin
      MINIO_ROOT_PASSWORD: docvaultadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: docvault-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
  es-data:
