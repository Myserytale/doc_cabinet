spring:
  application:
    name: docvault

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docvault}
    username: ${SPRING_DATASOURCE_USERNAME:docvault}
    password: ${SPRING_DATASOURCE_PASSWORD:docvaultpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    url: ${SPRING_FLYWAY_URL:${spring.datasource.url}}
    user: ${SPRING_FLYWAY_USER:${spring.datasource.username}}
    password: ${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

server:
  port: ${PORT:8080}

spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:thisIsADefaultSecretKeyWithAtLeast32Characters}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

docvault:
  minio:
    url: ${DOCVAULT_MINIO_URL:http://localhost:9000}
    access-key: ${DOCVAULT_MINIO_ACCESS_KEY:docvaultadmin}
    secret-key: ${DOCVAULT_MINIO_SECRET_KEY:docvaultadminpassword}
    bucket: ${DOCVAULT_MINIO_BUCKET:docvault}
  elasticsearch:
    uris: ${DOCVAULT_ELASTICSEARCH_URIS:http://localhost:9200}
